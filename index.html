<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裤佬免费TG代理 - 极致连接体验</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tgblue: '#0088cc',
                        tgalternate: '#00fbff',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --transition-speed: 0.5s;
        }

        body {
            transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
        }

        /* 背景流光动画 */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 136, 204, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            animation: move 25s infinite alternate;
        }

        @keyframes move {
            0% { transform: translate(-30%, -30%); }
            100% { transform: translate(30%, 30%); }
        }

        /* 玻璃拟态卡片 */
        .glass-card {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 模式切换按钮动画 */
        #theme-toggle i {
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .dark #theme-toggle .fa-sun { display: block; }
        .dark #theme-toggle .fa-moon { display: none; }
        #theme-toggle .fa-sun { display: none; }
        #theme-toggle .fa-moon { display: block; }

        /* 渐变文字 */
        .gradient-text {
            background: linear-gradient(135deg, #0088cc, #00fbff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white min-h-screen flex items-center justify-center overflow-hidden">
    
    <div class="bg-glow"></div>

    <button id="theme-toggle" onclick="toggleTheme()" class="fixed top-6 right-6 z-50 w-12 h-12 rounded-full bg-white/20 dark:bg-black/20 border border-slate-200 dark:border-white/10 flex items-center justify-center shadow-lg hover:scale-110 active:scale-90 transition-all">
        <i class="fas fa-sun text-yellow-400 text-xl"></i>
        <i class="fas fa-moon text-blue-400 text-xl"></i>
    </button>

    <div class="relative z-10 w-full max-w-md px-6">
        <div class="text-center mb-10">
            <div class="inline-block p-5 rounded-[2rem] bg-tgblue/10 dark:bg-white/5 mb-4 ring-1 ring-tgblue/20 dark:ring-white/10 shadow-xl">
                <i class="fab fa-telegram-plane text-5xl text-tgblue animate-pulse"></i>
            </div>
            <h1 class="text-4xl font-black tracking-tight mb-2">
                裤佬免费TG代理
            </h1>
            <p class="text-slate-500 dark:text-slate-400 text-xs tracking-widest uppercase font-semibold">Premium Proxy Hub</p>
        </div>

        <div class="glass-card bg-white/70 dark:bg-white/5 rounded-[2.5rem] p-8 border border-white/20 dark:border-white/10 shadow-2xl">
            <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-200 dark:border-white/5">
                <div class="text-left">
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Server Status</p>
                    <p class="text-emerald-500 font-bold flex items-center gap-2">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        在线连接
                    </p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Protocol</p>
                    <p class="font-black text-tgblue uppercase">Socks5</p>
                </div>
            </div>

            <div class="space-y-5">
                <div class="bg-slate-100 dark:bg-black/30 rounded-2xl p-4 border border-slate-200 dark:border-white/5 group relative cursor-pointer active:scale-95 transition-transform" onclick="copyConfig()">
                    <p class="text-[10px] text-slate-400 mb-1 font-bold">节点地址</p>
                    <p class="text-lg font-mono font-medium truncate pr-8">143.14.105.121:5555</p>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">
                        <i class="far fa-copy"></i>
                    </div>
                </div>

                <a href="tg://socks?server=143.14.105.121&port=5555&user=hanbaocloud&pass=hanbaocloud" 
                   class="group relative w-full bg-tgblue hover:bg-blue-600 text-white py-5 rounded-2xl font-bold text-lg flex items-center justify-center gap-3 transition-all shadow-[0_10px_30px_-10px_rgba(0,136,204,0.5)] overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
                    <i class="fas fa-bolt"></i> 一键直连代理
                </a>
            </div>

            <div class="mt-6 flex justify-around">
                <div class="text-center">
                    <p class="text-[10px] text-slate-400 font-bold mb-1">延迟</p>
                    <p class="text-sm font-mono font-bold text-emerald-500">24ms</p>
                </div>
                <div class="text-center border-x border-slate-200 dark:border-white/10 px-6">
                    <p class="text-[10px] text-slate-400 font-bold mb-1">加密</p>
                    <p class="text-sm font-mono font-bold">AES-256</p>
                </div>
                <div class="text-center">
                    <p class="text-[10px] text-slate-400 font-bold mb-1">负载</p>
                    <p class="text-sm font-mono font-bold text-orange-400">12%</p>
                </div>
            </div>
        </div>

        <div class="mt-10 text-center space-y-4">
            <p class="text-slate-400 dark:text-slate-500 text-xs font-medium italic">
                “ 速度与隐私，从未如此触手可及 ”
            </p>
            <div class="flex justify-center gap-4 text-xs font-bold text-slate-400 dark:text-slate-600">
                <span>BY 裤佬</span>
                <span>•</span>
                <span>2026 EDITION</span>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 opacity-0 transition-all duration-300 pointer-events-none translate-y-10">
        <div class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 font-bold text-sm">
            <i class="fas fa-check-circle text-emerald-500"></i>
            配置已复制到剪贴板
        </div>
    </div>

    <style>
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
    </style>

    <script>
        // 主题切换逻辑
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // 复制逻辑
        function copyConfig() {
            const config = "tg://socks?server=143.14.105.121&port=5555&user=hanbaocloud&pass=hanbaocloud";
            navigator.clipboard.writeText(config).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0', 'translate-y-10');
                toast.classList.add('opacity-100', 'translate-y-0');
                
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-10');
                    toast.classList.remove('opacity-100', 'translate-y-0');
                }, 2000);
            });
        }

        // 初始化检查本地存储
        if (localStorage.theme === 'light') {
            document.documentElement.classList.remove('dark');
        }
    </script>
</body>
</html>
